<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة</title>
    <meta name="description" content="استعلم عن نتيجة الثانوية العامة برقم الجلوس">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation"></div>
    <main class="container">
        <header class="header">
            <h1>نتيجة الثانوية العامة</h1>
            <p>ابحث برقم الجلوس لمعرفة النتيجة</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="number" id="seatNumberInput" placeholder="أدخل رقم الجلوس هنا..." />
                <button id="searchBtn" aria-label="بحث">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div id="loading" class="hidden">جاري البحث...</div>
            <div id="errorMessage" class="error hidden"></div>
        </section>

        <section id="resultSection" class="result-section hidden">
            <div class="result-card">
                <div class="result-header">
                    <h2>تفاصيل النتيجة</h2>
                    <span id="studentStatus" class="status badge"></span>
                </div>
                <div class="result-body">
                    <div class="data-group">
                        <span class="label">الاسم:</span>
                        <span id="studentName" class="value"></span>
                    </div>
                    <div class="data-group">
                        <span class="label">رقم الجلوس:</span>
                        <span id="seatNumberDisplay" class="value"></span>
                    </div>
                    <div class="data-group highlight">
                        <span class="label">المجموع الكلي:</span>
                        <div class="score-container">
                            <span id="totalDegree" class="value score"></span>
                            <span class="total-mark"> / 320</span>
                        </div>
                    </div>
                </div>
                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-label">النسبة المئوية:</span>
                        <span id="scorePercentage" class="percentage-value">%0</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="scoreProgress" class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
